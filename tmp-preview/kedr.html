<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width"><style>body{margin:0;background:#1a120c} .arena-photo{width:375px;height:520px;margin:20px auto;background:#2a1d14} .br-breath { animation: br-breath 3.2s ease-in-out infinite; }
